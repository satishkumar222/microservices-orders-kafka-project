spring.application.name=order-service

spring.config.import=optional:configserver:http://localhost:8888

management.endpoints.web.exposure.include=*
management.health.circuitbreakers.enabled=true

resilience4j.circuitbreaker.instances.orderService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.orderService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.orderService.sliding-window-size=5
resilience4j.circuitbreaker.instances.orderService.minimum-number-of-calls=3

#retry
resilience4j.retry.instances.productService.max-attempts=3
resilience4j.retry.instances.productService.wait-duration=2s

#Rate limiter
resilience4j.ratelimiter.instances.orderService.limit-for-period=3
resilience4j.ratelimiter.instances.orderService.limit-refresh-period=10s
resilience4j.ratelimiter.instances.orderService.timeout-duration=0

