---
services:
  eureka-server:
    image: eureka-server
    container_name: eureka-server-container
    ports:
      - 8761:8761
    networks:
      - microservices-network
  config-server:
    image: config-server
    container_name: config-server-container
    ports:
      - 8888:8888
    depends_on:
      - eureka-server
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server-container:8761/eureka
    networks:
      - microservices-network
  api-gateway:
    image: api-gateway
    container_name: api-gateway-container
    ports:
      - 9090:9090
    depends_on:
      - redis
      - eureka-server
      - config-server
    environment:
      SPRING_CONFIG_IMPORT: configserver:http://config-server-container:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server-container:8761/eureka
    networks:
      - microservices-network
  auth-service:
    image: auth-srvice
    container_name: auth-srvice-container
    ports:
      - 8085:8085
    depends_on:
      - eureka-server
      - config-server
    environment:
      SPRING_CONFIG_IMPORT: configserver:http://config-server-container:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server-container:8761/eureka
    networks:
      - microservices-network
  user-service:
    image: user-service
    container_name: user-service-container
    ports:
      - 1000:1000
    depends_on:
      - postgres
      - eureka-server
      - config-server
    environment:
      SPRING_CONFIG_IMPORT: configserver:http://config-server-container:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server-container:8761/eureka
    networks:
      - microservices-network
  product-service:
    image: product-service
    container_name: product-service-container
    ports:
      - 1001:1001
    depends_on:
      - postgres
      - eureka-server
      - config-server
    environment:
      SPRING_CONFIG_IMPORT: configserver:http://config-server-container:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server-container:8761/eureka
    networks:
      - microservices-network
  order-service:
    image: order-service
    container_name: order-service-container
    ports:
      - 1002:1002
    depends_on:
      - postgres
      - kafka
      - eureka-server
      - config-server
    environment:
      SPRING_CONFIG_IMPORT: configserver:http://config-server-container:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server-container:8761/eureka
    networks:
      - microservices-network
  payment-service:
    image: payment-service
    container_name: payment-service-container
    ports:
      - 1003:1003
    depends_on:
      - postgres
      - kafka
      - eureka-server
      - config-server
    environment:
      SPRING_CONFIG_IMPORT: configserver:http://config-server-container:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server-container:8761/eureka
    networks:
      - microservices-network
  postgres:
    image: postgres:17
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - 5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - microservices-network
  kafka:
    image: apache/kafka:3.9.1
    container_name: kafka
    ports:
      - 9092:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - microservices-network
  redis:
    image: redis:7.2
    container_name: redis
    ports:
      - 6379:6379
    restart: unless-stopped
    networks:
      - microservices-network
volumes:
  postgres-data:

networks:
  microservices-network: